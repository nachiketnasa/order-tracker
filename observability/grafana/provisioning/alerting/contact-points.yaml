apiVersion: 1

contactPoints:
  - orgId: 1
    name: incident-response
    receivers:
      - uid: incident-response-webhook
        type: webhook
        settings:
          # Grafana runs in Docker, the incident-response service runs on the
          # host (it needs the host's authenticated `claude` CLI), so it's
          # reached via host.docker.internal rather than a compose service name.
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST
